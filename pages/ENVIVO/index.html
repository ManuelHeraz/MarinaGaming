<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARINA GAMING TV - En Vivo</title>
    
    <!-- Librería crítica para leer .m3u8 en Chrome/Edge/Opera -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    
    <link rel="stylesheet" href="css/styles.css">
    <!-- Aquí iría tu link al CSS de la TV que te doy en el paso 2 -->
    <style>
        /* Pega aquí el CSS del Paso 2 si no usas archivo externo */
    </style>
</head>
<body>

    <div class="main-content">
        <!-- REPRODUCTOR TÁCTICO MARINA GAMING TV -->
        <div class="mg-tv-container">
            <div class="mg-tv-header">
                <span class="mg-live-badge"><span class="mg-live-dot"></span> EN VIVO</span>
                <h3>MARINA GAMING TV</h3>
                <p style="color: #aaa; font-size: 0.85rem; margin-top: 5px;">Transmisión Oficial</p>
            </div>
            
            <!-- Contenedor del Video -->
            <div class="mg-video-wrapper" id="mg-video-wrapper">
                
                <!-- LA MARCA DE AGUA COMPUESTA (TEXTO + LOGO + TEXTO) -->
                <div class="mg-watermark-container">
                    <span class="mg-watermark-text">MARINA GAMING TV</span>
                    <img src="https://i.imgur.com/nbFSvBy.png" alt="Logo MG" class="mg-watermark-logo">
                    <span class="mg-watermark-live"><span class="mg-live-dot-small"></span> EN VIVO</span>
                </div>

                <!-- Botón táctico de Pantalla Completa -->
                <button id="mg-fullscreen-btn" class="mg-fullscreen-btn" aria-label="Pantalla Completa">
                    <span class="material-symbols-outlined">fullscreen</span>
                </button>

                <!-- Video con controles nativos (corregido el poster) -->
                <video id="mg-tv-player" controls preload="auto" poster="https://i.imgur.com/nbFSvBy.png"></video>
            </div>

            <!-- ALERTAS E INFORMACIÓN -->
            <div class="mg-alerts-container">
                <div class="mg-alert mg-alert-discord">
                    <strong style="color: #00ccff;">🎮 Cartelera de Transmisión</strong>
                    Únete a nuestro Discord para conocer los horarios de los streams, torneos y eventos especiales.
                </div>
            </div>
        </div>  
    </div>


    
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('mg-tv-player');
    const streamUrl = "https://pub-3404987dd8c841489f9a817427cea40d.r2.dev/tv-envivo/index.m3u8";

    // 1. Verificamos si el navegador soporta hls.js (Chrome, Edge, Firefox, Opera)
    if (Hls.isSupported()) {
        const hls = new Hls({
            // Configuraciones tácticas para streams en vivo (reduce el lag)
            lowLatencyMode: true,
            backBufferLength: 90
        });
        
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        console.error("Error de red: La señal de Marina Gaming TV se ha perdido.");
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        console.error("Error de medio: Intentando recuperar la señal...");
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        break;
                }
            }
        });
    } 
    // 2. Fallback para navegadores de Apple (Safari en iOS/Mac) que soportan m3u8 nativamente
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
    }
});

// ==========================================
// LÓGICA DE PANTALLA COMPLETA Y ROTACIÓN
// ==========================================
const videoWrapper = document.getElementById('mg-video-wrapper');
const fsBtn = document.getElementById('mg-fullscreen-btn');
const fsIcon = fsBtn.querySelector('.material-symbols-outlined');

fsBtn.addEventListener('click', () => {
    // Si no estamos en pantalla completa...
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        
        // 1. Solicitar Pantalla Completa del CONTENEDOR (no del video)
        if (videoWrapper.requestFullscreen) {
            videoWrapper.requestFullscreen().then(lockScreen);
        } else if (videoWrapper.webkitRequestFullscreen) { /* Safari / Edge antiguo */
            videoWrapper.webkitRequestFullscreen();
            lockScreen();
        }

    } else {
        // 2. Salir de Pantalla Completa
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }
});

// Función para forzar rotación en móviles Android
function lockScreen() {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(err => {
            console.log("El navegador no permite forzar la rotación, el usuario debe girarlo manualmente.");
        });
    }
}

// Escuchar los cambios (por si el usuario sale presionando ESC en el teclado)
document.addEventListener('fullscreenchange', updateFsButton);
document.addEventListener('webkitfullscreenchange', updateFsButton);

function updateFsButton() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        fsIcon.textContent = 'fullscreen';
        // Desbloquear rotación al salir
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    } else {
        fsIcon.textContent = 'fullscreen_exit';
    }
}
</script>
</body>
</html>
